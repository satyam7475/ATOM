[pytest]
# Run via the project venv: `.venv/bin/python -m pytest tests/`
# Stock `/usr/bin/python3` (Apple 3.9.6) cannot collect modules that use
# `dataclass(slots=True)` or PEP 604 unions — see .python-version (3.11.15).
minversion = 8.0
testpaths = tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
log_cli = true
log_cli_level = WARNING
markers =
    slow: marks tests as slow / opt-in (deselect with -m "not slow")
