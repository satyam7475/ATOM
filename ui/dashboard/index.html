<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATOM // Neural Interface</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --bg:#04040a;
  --accent:#818cf8;
  --accent-glow:rgba(129,140,248,0.35);
  --green:#34d399;
  --orange:#fbbf24;
  --red:#f87171;
  --purple:#a78bfa;
  --text:#f0f0f4;
  --text-dim:#8888a0;
  --text-muted:#44445a;
  --font-display:'Sora',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}

html,body{
  height:100%;width:100%;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-size:13px;
}

.ambient{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 55% 45% at 50% 45%, rgba(129,140,248,0.05) 0%, transparent 70%),
    radial-gradient(ellipse 35% 35% at 25% 80%, rgba(52,211,153,0.02) 0%, transparent 60%),
    radial-gradient(ellipse 35% 35% at 75% 20%, rgba(167,139,250,0.02) 0%, transparent 60%);
}

/* ── Layout ────────────────────────────── */
.hud{
  position:relative;z-index:1;
  width:100vw;height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  align-items:center;
}

/* ── Top bar ───────────────────────────── */
.topbar{
  width:100%;height:44px;
  display:flex;align-items:center;
  padding:0 24px;
  background:rgba(4,4,10,0.9);
  border-bottom:1px solid rgba(255,255,255,0.03);
  backdrop-filter:blur(20px);z-index:30;
  flex-shrink:0;
}
.brand{
  font-family:var(--font-display);font-size:16px;font-weight:700;
  letter-spacing:5px;color:var(--text-dim);
}
.brand span{color:var(--accent);}
.topbar-right{
  margin-left:auto;display:flex;align-items:center;gap:14px;
}
.sys-pill{
  font-family:var(--font-mono);font-size:10px;
  color:var(--text-muted);letter-spacing:0.5px;
  display:flex;align-items:center;gap:5px;
}
.sys-pill .dot{
  width:5px;height:5px;border-radius:50%;
  transition:background .4s;
}
.sys-pill .dot.on{background:var(--green);box-shadow:0 0 6px rgba(52,211,153,0.5);}
.sys-pill .dot.off{background:var(--red);box-shadow:0 0 6px rgba(248,113,113,0.4);}
.sys-pill .dot.warn{background:var(--orange);box-shadow:0 0 6px rgba(251,191,36,0.4);}
/* Voice health — one glance */
.voice-health-strip{
  width:100%;padding:6px 20px 8px;
  font-family:var(--font-mono);font-size:10px;color:var(--text-muted);
  letter-spacing:0.02em;line-height:1.45;
  border-bottom:1px solid rgba(255,255,255,0.04);
  background:rgba(4,4,10,0.65);backdrop-filter:blur(12px);
  display:flex;flex-wrap:wrap;gap:10px 18px;z-index:25;
}
.voice-health-strip span{white-space:nowrap;max-width:100%;}
.voice-health-strip .vh-err{color:var(--orange);max-width:min(90vw,720px);white-space:normal;}
.voice-health-strip .vh-fb{width:100%;flex-basis:100%;color:var(--text-dim);font-size:9px;white-space:normal;max-width:min(96vw,900px);opacity:0.92;line-height:1.35;}
/* ── Jarvis boot (Iron Man HUD) ─────────── */
.jarvis-boot{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(129,140,248,0.12),var(--bg));
  transition:opacity .85s ease,visibility .85s;
}
.jarvis-boot.done{opacity:0;visibility:hidden;pointer-events:none;}
.jarvis-boot-inner{text-align:center;max-width:90vw;}
.jarvis-boot-line{
  font-family:var(--font-display);font-size:clamp(28px,8vw,44px);font-weight:700;
  letter-spacing:0.35em;color:var(--accent);
  text-shadow:0 0 40px var(--accent-glow);
  animation:bootPulse 2s ease-in-out infinite;
}
.jarvis-boot-sub{
  font-family:var(--font-mono);font-size:11px;letter-spacing:0.4em;color:var(--text-dim);
  margin-top:16px;
}
.jarvis-boot-bar{width:min(280px,70vw);height:2px;background:rgba(255,255,255,0.08);
  border-radius:1px;margin:24px auto 0;overflow:hidden;}
.jarvis-boot-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--green));
  animation:bootLoad 2.2s ease-out forwards;}
@keyframes bootPulse{0%,100%{opacity:0.85}50%{opacity:1}}
@keyframes bootLoad{0%{width:0}100%{width:100%}}

/* ── Brain zone ────────────────────────── */
.brain-zone{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;width:100%;
  margin-top:-20px;
}
.orb-wrap{
  width:260px;height:260px;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
#orbCanvas{
  display:block;
  filter:drop-shadow(0 0 50px var(--accent-glow));
  animation:brainIn 1.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
@keyframes brainIn{0%{opacity:0;transform:scale(0.2);}100%{opacity:1;transform:scale(1);}}
.orb-wrap[data-state="listening"] #orbCanvas{animation:brainPulse 2s ease-in-out infinite;}
@keyframes brainPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 40px var(--accent-glow));}50%{transform:scale(1.05);filter:drop-shadow(0 0 65px var(--accent-glow));}}
.orb-wrap[data-state="thinking"] #orbCanvas{animation:brainThink 0.9s ease-in-out infinite;}
@keyframes brainThink{0%,100%{transform:scale(1);filter:drop-shadow(0 0 40px rgba(251,191,36,0.5));}50%{transform:scale(1.06);filter:drop-shadow(0 0 60px rgba(251,191,36,0.7));}}
.orb-wrap[data-state="speaking"] #orbCanvas{animation:brainSpeak 1.6s ease-in-out infinite;}
@keyframes brainSpeak{0%,100%{filter:drop-shadow(0 0 35px rgba(167,139,250,0.5));}50%{filter:drop-shadow(0 0 55px rgba(167,139,250,0.7));}}

/* ── State + transcript ────────────────── */
.state-label{
  font-family:var(--font-display);font-size:14px;font-weight:600;
  letter-spacing:6px;color:var(--accent);
  margin-top:12px;transition:color .4s;
}
.state-sub{
  font-family:var(--font-mono);font-size:11px;
  color:var(--text-muted);margin-top:4px;
  min-height:14px;
}

.transcript-zone{
  width:min(85vw,580px);margin-top:16px;
  text-align:center;min-height:80px;
}
.heard-line{
  font-family:var(--font-body);font-size:15px;
  color:var(--accent);opacity:0.8;
  min-height:22px;line-height:1.5;
  transition:opacity .3s;
}
.heard-line:empty{opacity:0;}
.response-line{
  font-family:var(--font-body);font-size:15px;
  color:var(--text);line-height:1.6;
  margin-top:8px;min-height:22px;
  max-height:120px;overflow-y:auto;
  scrollbar-width:none;
}
.response-line::-webkit-scrollbar{display:none;}

.live-os-panel{
  width:min(92vw,760px);margin-top:18px;
  display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px;
}
.camera-card,.turn-card{
  border:1px solid rgba(129,140,248,0.14);
  background:linear-gradient(180deg,rgba(129,140,248,0.08),rgba(4,4,10,0.42));
  border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,0.22);
  backdrop-filter:blur(18px);overflow:hidden;
}
.camera-card{height:124px;position:relative;}
.camera-card video{
  width:100%;height:100%;object-fit:cover;transform:scaleX(-1);
  filter:saturate(1.05) contrast(1.05);
}
.camera-status{
  position:absolute;left:10px;bottom:8px;
  font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;
  color:rgba(240,240,244,0.84);text-shadow:0 1px 8px rgba(0,0,0,0.8);
}
.turn-card{padding:12px 14px;text-align:left;min-height:124px;}
.turn-title{
  font-family:var(--font-mono);font-size:9px;letter-spacing:0.16em;
  color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;
}
.turn-row{margin-top:8px;}
.turn-label{
  font-family:var(--font-mono);font-size:9px;letter-spacing:0.14em;
  color:var(--accent);text-transform:uppercase;margin-bottom:4px;
}
.turn-text{
  min-height:20px;line-height:1.45;color:var(--text);
  overflow:hidden;display:-webkit-box;line-clamp:2;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.turn-text.muted{color:var(--text-muted);}

.thinking-bar-wrap{
  width:140px;height:2px;background:rgba(255,255,255,0.06);
  border-radius:1px;margin:8px auto 0;overflow:hidden;
  opacity:0;transition:opacity .3s;
}
.thinking-bar-wrap.visible{opacity:1;}
.thinking-bar-fill{
  height:100%;background:var(--orange);border-radius:1px;
  transition:width .5s linear;
}

/* ── Clock ─────────────────────────────── */
.clock-strip{
  font-family:var(--font-mono);
  color:var(--text-muted);letter-spacing:2px;
  margin-top:12px;font-size:11px;
}

/* ── Mic button ────────────────────────── */
.mic-zone{
  flex-shrink:0;
  padding-bottom:max(28px, env(safe-area-inset-bottom, 28px));
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.mic-btn{
  width:64px;height:64px;border-radius:50%;
  background:rgba(129,140,248,0.08);
  border:2px solid rgba(129,140,248,0.2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .3s;position:relative;
  outline:none;
}
.mic-btn:hover{
  background:rgba(129,140,248,0.14);
  border-color:rgba(129,140,248,0.35);
}
.mic-btn.active{
  background:rgba(52,211,153,0.12);
  border-color:rgba(52,211,153,0.4);
  animation:micPulse 1.5s ease-in-out infinite;
}
@keyframes micPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,0.3);}
  50%{box-shadow:0 0 0 14px rgba(52,211,153,0);}
}
.mic-btn.error{
  background:rgba(248,113,113,0.1);
  border-color:rgba(248,113,113,0.3);
}
.mic-btn.disabled{opacity:0.35;cursor:not-allowed;}
.mic-btn svg{width:24px;height:24px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s;}
.mic-btn.active svg{stroke:var(--green);}
.mic-btn.error svg{stroke:var(--red);}

.mic-hint{
  font-family:var(--font-mono);font-size:10px;
  color:var(--text-muted);letter-spacing:1px;
  min-height:14px;
}

/* ── Floating system strip ─────────────── */
.sys-strip{
  position:fixed;bottom:max(28px, env(safe-area-inset-bottom, 28px));
  right:16px;z-index:20;
  display:flex;gap:16px;
  font-family:var(--font-mono);font-size:10px;
  color:var(--text-muted);letter-spacing:0.5px;
}

/* ── Responsive ────────────────────────── */
@media(max-width:600px){
  .orb-wrap{width:180px;height:180px;}
  .state-label{font-size:12px;letter-spacing:4px;}
  .heard-line,.response-line{font-size:13px;}
  .live-os-panel{grid-template-columns:1fr;width:min(92vw,420px);}
  .camera-card{height:150px;}
  .sys-strip{display:none;}
}
</style>
</head>
<body>

<div class="ambient"></div>

<div class="hud">
  <header class="topbar">
    <div class="brand">ATOM <span style="opacity:0.5;font-weight:400">//</span> <span style="font-size:11px;letter-spacing:0.25em;font-weight:500">NEURAL</span></div>
    <div class="topbar-right">
      <div class="sys-pill"><span class="dot on" id="connWs"></span><span id="connWsLabel">LINK</span></div>
      <div class="sys-pill"><span class="dot on" id="connStt"></span>VOICE</div>
      <div class="sys-pill"><span class="dot on" id="connTts"></span>TTS</div>
    </div>
  </header>

  <div class="voice-health-strip" id="voiceHealthStrip" aria-label="Voice and mode health">
    <span id="vhStt">STT —</span>
    <span id="vhPerm">Speech: — · Mic: —</span>
    <span id="vhLc">Lifecycle: —</span>
    <span id="vhTier">Tier: —</span>
    <span class="vh-err" id="vhErr"></span>
    <span class="vh-fb" id="vhFb" role="status"></span>
  </div>

  <div class="brain-zone">
    <div class="orb-wrap" id="orbWrap" data-state="idle">
      <canvas id="orbCanvas" width="520" height="520"></canvas>
    </div>

    <div class="state-label" id="stateLabel">IDLE</div>
    <div class="state-sub" id="stateSub">Waiting...</div>

    <div class="transcript-zone">
      <div class="heard-line" id="heardLine"></div>
      <div class="response-line" id="responseLine"></div>
      <div class="thinking-bar-wrap" id="thinkingWrap">
        <div class="thinking-bar-fill" id="thinkingBar" style="width:0%"></div>
      </div>
    </div>

    <div class="live-os-panel" aria-label="Live owner and turn view">
      <div class="camera-card">
        <video id="ownerCamera" autoplay playsinline muted></video>
        <div class="camera-status" id="cameraStatus">CAMERA STANDBY</div>
      </div>
      <div class="turn-card">
        <div class="turn-title">REAL-TIME OWNER CHANNEL</div>
        <div class="turn-row">
          <div class="turn-label">FINAL INPUT</div>
          <div class="turn-text muted" id="finalInputLine">Waiting for Boss...</div>
        </div>
        <div class="turn-row">
          <div class="turn-label">ATOM RESPONSE</div>
          <div class="turn-text muted" id="finalResponseLine">No response yet.</div>
        </div>
      </div>
    </div>

    <div class="clock-strip" id="clockStrip">--:-- --</div>
  </div>

  <div class="mic-zone" aria-live="polite">
    <div class="mic-hint" id="micHint">ALWAYS-ON MIC — SPEAK NATURALLY</div>
  </div>
</div>

<div class="jarvis-boot" id="jarvisBoot" aria-hidden="true">
  <div class="jarvis-boot-inner">
    <div class="jarvis-boot-line">ATOM</div>
    <div class="jarvis-boot-sub">NEURAL INTERFACE · INITIALIZING</div>
    <div class="jarvis-boot-bar"><div class="jarvis-boot-fill"></div></div>
  </div>
</div>

<div class="sys-strip">
  <span>CPU <span id="cpuVal">0</span>%</span>
  <span>RAM <span id="ramVal">0</span>%</span>
  <span>BAT <span id="batteryVal">--</span></span>
</div>

<!-- ── Three.js Brain ──────────────────── -->
<script type="importmap">{"imports":{"three":"https://esm.sh/three@0.160.0"}}</script>
<script type="module">
import * as THREE from 'three';

const canvas=document.getElementById('orbCanvas');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
function layout(){
  const w=document.getElementById('orbWrap');
  if(!w)return;
  const d=Math.min(w.clientWidth,w.clientHeight);
  const s=Math.max(140,Math.min(d||260,260));
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.setSize(s,s);
}
layout();window.addEventListener('resize',layout);

const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(45,1,0.1,100);cam.position.z=4;

const SC={
  sleep:     {c:0x52525b,g:0x3f3f46,w:0x52525b,p:0x52525b,s:0x3f3f46},
  idle:      {c:0x818cf8,g:0x4338ca,w:0x6366f1,p:0xa5b4fc,s:0x4f46e5},
  listening: {c:0x34d399,g:0x065f46,w:0x6ee7b7,p:0x34d399,s:0x059669},
  thinking:  {c:0xfbbf24,g:0x92400e,w:0xf59e0b,p:0xfde68a,s:0xd97706},
  speaking:  {c:0xa78bfa,g:0x6d28d9,w:0xc4b5fd,p:0xa78bfa,s:0x7c3aed},
  error_recovery:{c:0xf87171,g:0x991b1b,w:0xfca5a5,p:0xf87171,s:0xdc2626},
};
const SS={
  sleep:{rot:0.1,pulse:0.3,synapse:0.005},
  idle:{rot:0.3,pulse:0.6,synapse:0.015},
  listening:{rot:0.6,pulse:1.0,synapse:0.03},
  thinking:{rot:2.0,pulse:2.5,synapse:0.08},
  speaking:{rot:1.0,pulse:1.5,synapse:0.03},
  error_recovery:{rot:1.5,pulse:3.0,synapse:0.06},
};
let cs='idle',tc=SC.idle,ts=SS.idle;

const brainGeo=new THREE.SphereGeometry(0.75,80,60);
const posAttr=brainGeo.attributes.position;
const norAttr=brainGeo.attributes.normal;
function fbm(x,y,z){
  let v=0,a=0.5,f=1.0;
  for(let i=0;i<5;i++){
    v+=a*Math.sin(x*f+y*f*0.7)*Math.cos(y*f+z*f*0.9)*Math.sin(z*f+x*f*0.6);
    f*=2.1;a*=0.45;
  }
  return v;
}
for(let i=0;i<posAttr.count;i++){
  let x=posAttr.getX(i),y=posAttr.getY(i),z=posAttr.getZ(i);
  const len=Math.sqrt(x*x+y*y+z*z);
  const nx=x/len,ny=y/len,nz=z/len;
  const hemisphereGap=Math.exp(-Math.pow(nz*8,2))*0.06;
  const sulci=fbm(nx*4.5,ny*4.5,nz*4.5)*0.09;
  const frontalBulge=(nx>0.3?0.04:0)*(1-Math.abs(nz));
  const d=sulci-hemisphereGap+frontalBulge;
  posAttr.setXYZ(i,x+norAttr.getX(i)*d,y+norAttr.getY(i)*d,z+norAttr.getZ(i)*d);
}
brainGeo.computeVertexNormals();

const brainMat=new THREE.ShaderMaterial({
  uniforms:{
    uTime:{value:0},uColor:{value:new THREE.Color(0x818cf8)},
    uGlow:{value:new THREE.Color(0x4338ca)},uPulse:{value:0.6},uActivity:{value:0},
  },
  vertexShader:`
    uniform float uTime;uniform float uActivity;
    varying vec3 vN;varying vec3 vPos;varying float vFresnel;
    void main(){
      vN=normalize(normalMatrix*normal);vPos=position;
      vec3 vd=normalize(cameraPosition-(modelMatrix*vec4(position,1.0)).xyz);
      vec3 wn=normalize((modelMatrix*vec4(normal,0.0)).xyz);
      vFresnel=pow(1.0-abs(dot(wn,vd)),3.0);
      float b=sin(position.x*3.0+uTime*1.5)*sin(position.y*4.0+uTime)*0.015*(1.0+uActivity*3.0);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position+normal*b,1.0);
    }`,
  fragmentShader:`
    uniform float uTime;uniform vec3 uColor;uniform vec3 uGlow;uniform float uPulse;
    varying vec3 vN;varying vec3 vPos;varying float vFresnel;
    void main(){
      float p=0.7+0.3*sin(uTime*uPulse);
      float cx=sin(vPos.x*12.0+uTime*0.8)*sin(vPos.y*10.0+uTime*0.5)*0.15;
      vec3 base=mix(uGlow*0.6,uColor,0.3+vFresnel*0.7+cx)*p;
      vec3 rim=uColor*vFresnel*1.2;
      float a=0.1+vFresnel*0.6+cx*0.08;
      gl_FragColor=vec4(base+rim,clamp(a,0.0,0.85));
    }`,
  transparent:true,side:THREE.DoubleSide,depthWrite:false,
});
const brain=new THREE.Mesh(brainGeo,brainMat);
brain.rotation.x=-0.2;scene.add(brain);

const wireMat=new THREE.MeshBasicMaterial({color:0x6366f1,transparent:true,opacity:0.07,wireframe:true});
const wireframe=new THREE.Mesh(brainGeo.clone(),wireMat);
wireframe.rotation.copy(brain.rotation);scene.add(wireframe);

const sCount=140,sPos=new Float32Array(sCount*3);
for(let i=0;i<sCount;i++){
  const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=0.78+Math.random()*0.4;
  sPos[i*3]=r*Math.sin(ph)*Math.cos(th);sPos[i*3+1]=r*Math.sin(ph)*Math.sin(th);sPos[i*3+2]=r*Math.cos(ph);
}
const sGeo=new THREE.BufferGeometry();sGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));
const sMat=new THREE.PointsMaterial({color:0xa5b4fc,size:0.025,transparent:true,opacity:0.6});
const synapses=new THREE.Points(sGeo,sMat);scene.add(synapses);

const rMat=new THREE.MeshBasicMaterial({color:0x818cf8,transparent:true,opacity:0.15});
const ring1=new THREE.Mesh(new THREE.TorusGeometry(1.2,0.005,16,120),rMat);
ring1.rotation.x=Math.PI/2.2;scene.add(ring1);
const ring2=new THREE.Mesh(new THREE.TorusGeometry(1.35,0.003,16,80),
  new THREE.MeshBasicMaterial({color:0x818cf8,transparent:true,opacity:0.08}));
ring2.rotation.x=Math.PI/3.5;ring2.rotation.y=Math.PI/5;scene.add(ring2);

const clk=new THREE.Clock();
function anim(){
  requestAnimationFrame(anim);const t=clk.getElapsedTime();
  brainMat.uniforms.uTime.value=t;
  brainMat.uniforms.uColor.value.lerp(new THREE.Color(tc.c),0.03);
  brainMat.uniforms.uGlow.value.lerp(new THREE.Color(tc.g),0.03);
  brainMat.uniforms.uPulse.value+=(ts.pulse-brainMat.uniforms.uPulse.value)*0.05;
  const act=cs==='thinking'?1:cs==='speaking'?0.4:cs==='listening'?0.25:0;
  brainMat.uniforms.uActivity.value+=(act-brainMat.uniforms.uActivity.value)*0.05;
  brain.rotation.y+=ts.rot*0.008;brain.rotation.x=-0.2+Math.sin(t*0.25)*0.08;
  wireframe.rotation.copy(brain.rotation);
  wireMat.color.lerp(new THREE.Color(tc.w),0.03);
  wireMat.opacity+=(0.05+act*0.07-wireMat.opacity)*0.05;
  synapses.rotation.y+=ts.rot*0.004;synapses.rotation.x=Math.sin(t*0.15)*0.1;
  sMat.color.lerp(new THREE.Color(tc.p),0.03);
  sMat.opacity=0.4+Math.sin(t*ts.synapse*12)*0.2;
  sMat.size=0.02+act*0.015+Math.sin(t*2)*0.005;
  ring1.rotation.z+=0.002;ring1.scale.setScalar(1+Math.sin(t*ts.synapse*8)*0.04);
  rMat.color.lerp(new THREE.Color(tc.s),0.03);
  ring2.rotation.z-=0.0015;ring2.rotation.x+=0.0008;
  renderer.render(scene,cam);
}
anim();

window.setOrbState=s=>{cs=s;tc=SC[s]||SC.idle;ts=SS[s]||SS.idle;};
window.setOrbModeTheme=mt=>{
  SC.idle.c=mt.orbCore;SC.idle.g=mt.orbGlow;SC.idle.w=mt.orbCore;SC.idle.p=mt.orbParticle;SC.idle.s=mt.orbGlow;
  SC.listening.c=mt.orbCore;SC.listening.g=mt.orbGlow;SC.listening.w=mt.orbCore;SC.listening.p=mt.orbParticle;SC.listening.s=mt.orbGlow;
  if(cs==='idle'||cs==='listening')tc=SC[cs];
};
</script>

<script>
(function(){
const $=id=>document.getElementById(id);
const WS='ws://'+location.host+'/ws';
let ws;
let atomState=null;
let bootSplashEnabled=true;
let lastFinalInput='';
let lastSpokenText='';
let awaitingResponse=false;
let acceptedLiveTurn=false;

function dismissJarvisBoot(){
  const el=$('jarvisBoot');
  if(!el||el.classList.contains('done'))return;
  el.classList.add('done');
  setTimeout(()=>{try{el.remove();}catch(_){}},900);
}

function deepClone(v){return v==null?v:JSON.parse(JSON.stringify(v));}
function deepMerge(t,p){
  if(!p||typeof p!=='object')return t;
  Object.keys(p).forEach(k=>{
    const v=p[k];
    if(v&&typeof v==='object'&&!Array.isArray(v)){
      const b=(t[k]&&typeof t[k]==='object'&&!Array.isArray(t[k]))?t[k]:{};
      t[k]=deepMerge(b,v);return;
    }
    t[k]=v;
  });
  return t;
}
function clip(t,n=200){const c=String(t||'').trim();if(c.length<=n)return c||'';return c.slice(0,n-1).trimEnd()+'…';}

/* ── Clock ─────────────────────────────── */
function tickClock(){
  const n=new Date();
  let h=n.getHours(),m=n.getMinutes();
  const ap=h>=12?'PM':'AM';h=h%12||12;
  const d=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  $('clockStrip').textContent=
    String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+' '+ap+
    '  ·  '+d[n.getDay()]+' '+mo[n.getMonth()]+' '+n.getDate();
}
tickClock();setInterval(tickClock,30000);

/* ── State colors ──────────────────────── */
const stColors={idle:'var(--accent)',listening:'var(--green)',thinking:'var(--orange)',speaking:'var(--purple)',error_recovery:'var(--red)',sleep:'var(--text-muted)'};

function setAppState(state,label,status){
  $('stateLabel').textContent=label||state.toUpperCase();
  $('stateLabel').style.color=stColors[state]||'var(--accent)';
  $('stateSub').textContent=status||'';
  $('orbWrap').setAttribute('data-state',state);
  if(window.setOrbState)window.setOrbState(state);
  if(state!=='thinking'){
    $('thinkingWrap').classList.remove('visible');
    $('thinkingBar').style.width='0%';
  }
}

function showHeard(text){
  $('heardLine').textContent=text?'"'+clip(text,160)+'"':'';
}
function showResponse(text){
  const el=$('responseLine');
  el.textContent=clip(text,400);
  el.scrollTop=el.scrollHeight;
}
function setTurnInput(text){
  const val=clip(text,220);
  const el=$('finalInputLine');
  if(!el)return;
  el.textContent=val||'Waiting for Boss...';
  el.classList.toggle('muted',!val);
}
function setTurnResponse(text){
  const val=clip(text,260);
  const el=$('finalResponseLine');
  if(!el)return;
  el.textContent=val||'Waiting for ATOM...';
  el.classList.toggle('muted',!val);
}
function clearLiveTurn(){
  lastFinalInput='';
  lastSpokenText='';
  awaitingResponse=false;
  showHeard('');
  showResponse('');
  setTurnInput('');
  setTurnResponse('');
}

async function startOwnerCamera(){
  const video=$('ownerCamera'),status=$('cameraStatus');
  if(!video||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    if(status)status.textContent='CAMERA UNAVAILABLE';
    return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},
      audio:false
    });
    video.srcObject=stream;
    if(status)status.textContent='MACBOOK CAMERA LIVE';
  }catch(e){
    if(status)status.textContent='CAMERA PERMISSION NEEDED';
  }
}

/* ── System ────────────────────────────── */
function updateSystem(d){
  $('cpuVal').textContent=Math.round(d.cpu||0);
  $('ramVal').textContent=Math.round(d.ram||0);
  if(d.battery!=null)$('batteryVal').textContent=d.battery+'%'+(d.charging?' ⚡':'');
}

/* ── Performance mode ──────────────────── */
let curPerfActive='optimal';
const MT={
  optimal:{orbCore:0x34d399,orbGlow:0x065f46,orbRing:0x34d399,orbParticle:0x6ee7b7},
  full_performance:{orbCore:0x818cf8,orbGlow:0x4338ca,orbRing:0x818cf8,orbParticle:0xa5b4fc},
  auto:{orbCore:0xfb923c,orbGlow:0x9a3412,orbRing:0xfb923c,orbParticle:0xfdba74},
};
function setPerfUI(eff){
  if(eff)curPerfActive=eff;
  const t=MT[curPerfActive]||MT.optimal;
  if(window.setOrbModeTheme)window.setOrbModeTheme(t);
}

function clipStr(s,n){
  if(s==null||s==='')return '';
  const t=String(s);
  return t.length<=n?t:t.slice(0,Math.max(0,n-1))+'…';
}

/* ── Render full state (native STT only; no dashboard text/mic button) ─ */
function syncVoiceRibbon(lc,v){
  const hint=$('micHint');
  if(!hint)return;
  const st=String(lc.state||'idle');
  if(st==='listening')hint.textContent='ALWAYS-ON MIC — LISTENING';
  else if(st==='thinking')hint.textContent='PROCESSING';
  else if(st==='speaking')hint.textContent='ATOM SPEAKING';
  else if(st==='error_recovery')hint.textContent='RECOVERING — STANDBY';
  else hint.textContent='ALWAYS-ON MIC — SPEAK NATURALLY';
}

function syncVoiceHealthStrip(lc,v,mode,exec){
  const eng=String(v.stt_engine||'');
  const elow=eng.toLowerCase();
  const sttReady=!!eng&&!elow.includes('disabled')&&elow!=='unavailable'&&!elow.includes('voice input unavailable');
  const sp=String((v.permissions&&v.permissions.speech)||'?');
  const mic=String((v.permissions&&v.permissions.microphone)||'?');
  const permBad=/denied|restricted|bundle_missing/i.test(sp+mic);
  const hasErr=!!(v.error&&String(v.error).trim());
  let dot='off';
  if(sttReady)dot=(permBad||hasErr)?'warn':'on';
  $('connStt').className='dot '+dot;

  const st=String(lc.state||'—');
  const lm=v.launch_mode?(' ['+v.launch_mode+']'):'';
  $('vhStt').textContent='STT: '+clipStr(eng,42)+lm;
  $('vhPerm').textContent='Speech: '+sp+' · Mic: '+mic;
  $('vhLc').textContent='Lifecycle: '+st+(v.listening===true?' · capturing':'' );
  const tier=String(mode.product_tier||'—');
  const cloud=mode.cloud_enabled===false?'local-only':'cloud OK';
  const lat=(v.perceived_latency_ms!=null&&v.perceived_latency_ms!=='')?(' · '+Math.round(Number(v.perceived_latency_ms))+'ms'):'';
  const intent=(exec&&exec.last_intent)?(' · '+clipStr(String(exec.last_intent),28)):'';
  $('vhTier').textContent='Tier: '+tier+' · '+cloud+lat+intent;
  const errLine=v.error?('Err: '+clipStr(v.error,120)):'';
  $('vhErr').textContent=errLine;
  const fc=Array.isArray(v.fallback_chain)?v.fallback_chain:[];
  const fb=fc.length?('Fallback trace: '+fc.map(x=>clipStr(String(x),200)).join(' · ')):'';
  const ab=v.app_bundle?(' · bundle: '+clipStr(v.app_bundle,64)):'';
  $('vhFb').textContent=fb?(fb+ab):ab?('Launch'+ab):'';
}

function renderAtomState(){
  if(!atomState)return;
  const lc=atomState.lifecycle||{};
  const sys=atomState.system||{};
  const exec=atomState.execution||{};
  const v=atomState.voice||{};
  const mode=atomState.mode||{};

  if(lc.state)setAppState(String(lc.state||'idle'),String(lc.label||'IDLE'),String(lc.status||''));

  updateSystem({
    cpu:Math.round(Number(sys.cpu||0)),
    ram:Math.round(Number(sys.memory_pct||0)),
    battery:sys.battery_pct!=null?Math.round(Number(sys.battery_pct||0)):null,
    charging:!!sys.charging,
  });

  $('connTts').className='dot '+(!!v.tts_engine?'on':'off');

  setPerfUI(mode.effective||curPerfActive);
  syncVoiceRibbon(lc,v);
  syncVoiceHealthStrip(lc,v,mode,exec);

  const finalText=v.last_final||exec.last_query||'';
  if(finalText&&finalText!==lastFinalInput){
    lastFinalInput=finalText;
    awaitingResponse=true;
    setTurnInput(finalText);
    setTurnResponse('');
    showResponse('');
  }

  const activeTask=exec.active_task||exec.label||exec.last_query||'';
  if(activeTask&&lc.state==='thinking')showHeard(activeTask);

  const spoken=v.last_spoken||'';
  if(spoken&&acceptedLiveTurn&&spoken!==lastSpokenText){
    lastSpokenText=spoken;
    awaitingResponse=false;
    showResponse(spoken);
    setTurnResponse(spoken);
  }else if(spoken&&acceptedLiveTurn&&!awaitingResponse){
    showResponse(spoken);
    setTurnResponse(spoken);
  }

  const hearPrev=v.last_partial||'';
  if(hearPrev)showHeard(hearPrev);
}

/* ── State management ──────────────────── */
function applySnapshot(s){
  atomState=deepClone(s||{});
  if(atomState.voice){
    atomState.voice.last_partial='';
    atomState.voice.last_final='';
    atomState.voice.last_spoken='';
  }
  if(atomState.execution){
    atomState.execution.last_query='';
    atomState.execution.active_task='';
  }
  clearLiveTurn();
  renderAtomState();
}
function applyDiff(d){
  if(!atomState)atomState={};
  acceptedLiveTurn=true;
  deepMerge(atomState,d||{});
  renderAtomState();
}

/* ── WebSocket ─────────────────────────── */
function connect(){
  ws=new WebSocket(WS);
  ws.onopen=()=>{
    $('connWs').className='dot on';$('connWsLabel').textContent='LIVE';
  };
  ws.onmessage=e=>{try{
    const d=JSON.parse(e.data);
    switch(d.type){
      case 'init':
        if(typeof d.jarvis_boot_splash==='boolean')bootSplashEnabled=d.jarvis_boot_splash;
        if(!bootSplashEnabled)dismissJarvisBoot();
        if(d.snapshot)applySnapshot(d.snapshot);
        if(!atomState){
          if(d.state)setAppState(d.state,d.label,d.status);
          if(d.perf_mode)setPerfUI(d.perf_mode);
        }
        break;
      case 'state_snapshot':applySnapshot(d.snapshot);dismissJarvisBoot();break;
      case 'state_diff':applyDiff(d.diff);dismissJarvisBoot();break;
      case 'self_check_result':
        if(d.report&&d.report.summary_text)showResponse(d.report.summary_text);
        break;
      case 'state':
        /* Always merge: after init, atomState exists but legacy `state` events must still refresh the orb. */
        if(d.state){
          if(!atomState){
            setAppState(d.state,d.label,d.status);
          } else {
            atomState.lifecycle=atomState.lifecycle||{};
            atomState.lifecycle.state=d.state;
            if(d.label!==undefined&&d.label!==null)atomState.lifecycle.label=d.label;
            if(d.status!==undefined&&d.status!==null)atomState.lifecycle.status=d.status;
            renderAtomState();
          }
        }
        break;
      case 'log':
        if(atomState)break;
        if(d.tag==='heard')showHeard(d.message);
        else if(d.tag==='speaking')showResponse(d.message);
        else if(d.tag==='action'&&d.message&&d.message!=='Thinking with local brain...')showResponse(d.message);
        break;
      case 'system':
        if(!atomState)updateSystem(d);
        break;
      case 'hearing':
        if(!atomState&&d.text)showHeard(d.text);
        break;
      case 'thinking_progress':
        $('thinkingWrap').classList.add('visible');
        const pct=Math.min(100,d.estimate_s>0?(d.elapsed_s/d.estimate_s)*100:0);
        $('thinkingBar').style.width=pct+'%';
        break;
      case 'perf_mode':
        if(!atomState)setPerfUI(d.mode||curPerfActive);
        break;
      case 'restarting':
        showResponse('Switching to '+String(d.mode||'').replace(/_/g,' ')+' mode...');
        break;
    }
  }catch(ex){console.debug('ws:',ex);}};
  ws.onclose=()=>{
    $('connWs').className='dot off';$('connWsLabel').textContent='LOST';
    setTimeout(connect,2000);
  };
  ws.onerror=()=>ws.close();
}
connect();
startOwnerCamera();
setTimeout(()=>{if($('jarvisBoot')&&!$('jarvisBoot').classList.contains('done'))dismissJarvisBoot();},3200);

tickClock();

/* ── Expose for backend perf mode ──────── */
window.setAssistantMode=m=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'set_assistant_mode',mode:m}));};
window.setBrainProfile=p=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'set_brain_profile',profile:p}));};
})();
</script>
</body>
